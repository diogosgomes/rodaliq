<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#14213d;--muted:#5b6478;--line:#e3e7ef;
  --blue:#1f6feb;--blue2:#0b4fc4;--blueSoft:#e8f0fe;
  --amber:#f59e0b;--amberInk:#8a5200;--amberSoft:#fff4dc;
  --red:#c2410c;--redSoft:#fde8de;--gray:#9aa3b5;
  --r:12px;--sh:0 1px 2px rgba(20,33,61,.06),0 2px 10px rgba(20,33,61,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue)}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.loginCard{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:28px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px}
.brand .t1{font-weight:700;font-size:18px;letter-spacing:-.2px}
.brand .t1 b{color:var(--blue)}
.brand .t1.wm{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.idot{position:relative;display:inline-block}
.idot::after{content:'';position:absolute;left:50%;top:.08em;width:.17em;height:.17em;border-radius:50%;background:var(--amber);transform:translateX(-50%)}
.selo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px;color:var(--muted);font-size:12px}
.brand .t2{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.pw{position:relative}.pw .inp{padding-right:40px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:16px;padding:4px}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f7f9fc}
.btn.warn{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;margin-top:16px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.hmo{display:inline-flex;align-items:center;gap:6px;background:var(--amberSoft);color:var(--amberInk);border:1px solid #f3d08b;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.2px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 10px 30px}
/* app */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hbar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hbar .sp{flex:1}
.sync{font-size:12px;color:var(--muted)}
.tabs{max-width:1200px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1200px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.mpick{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px}
.mpick button{border:0;background:none;cursor:pointer;padding:5px 9px;border-radius:7px;font-weight:700}
.mpick button:hover{background:var(--blueSoft)}
.mpick span{min-width:110px;text-align:center;font-weight:600}
select.inp.auto{width:auto;padding:7px 10px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{border:2px solid var(--blue)}
.kpi.wide{grid-column:span 2}
.bacts{display:flex;gap:6px;flex-wrap:wrap}
.bloco{margin-bottom:14px;border:1px solid var(--line);background:#fbfcfe}
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bh h2{margin:0}
.bloco .kpi{box-shadow:none;border:1px solid var(--line)}
.bloco .kpi.hl{border:2px solid var(--blue)}
.par{grid-column:span 3;display:grid;grid-template-columns:1fr 2fr;gap:10px;border:2px solid var(--ink);border-radius:14px;padding:8px}
.par .kpi.wide{grid-column:auto}
@media(max-width:860px){.par{grid-column:1/-1}}
@media(max-width:560px){.par{grid-template-columns:1fr}}
@media(max-width:560px){.kpi.wide{grid-column:1/-1}}
.pos{color:var(--blue2)}.neg{color:var(--red)}
.two{grid-template-columns:1.4fr 1fr}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.bar{height:10px;border-radius:99px;background:#edf0f6;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.am>i{background:var(--amber)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{border-radius:8px;min-height:52px;padding:4px 5px;background:#f6f8fb;border:1px solid transparent;font-size:11px;display:flex;flex-direction:column}
.cal .d .n{font-weight:700;color:var(--muted)}
.cal .d .x{margin-top:auto;font-weight:700;font-size:11px}
.cal .d.ok{background:var(--blue);color:#fff}.cal .d.ok .n{color:#dbe7ff}
.cal .d.part{background:var(--amberSoft);border-color:var(--amber);color:var(--amberInk)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.fut{opacity:.45}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* tables / lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{font-weight:700;background:#f8fafd}
.tblwrap{overflow-x:auto}
.mgroup{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.mhead .t{font-weight:700}
.mhead .sp{flex:1}
.mhead .sg{font-weight:700;width:18px;text-align:center;color:var(--blue)}
.mbody{border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .dt{min-width:74px;font-weight:600}
.row .dt small{display:block;color:var(--muted);font-weight:500}
.row .main{flex:1;min-width:0}
.row .main .obs{color:var(--muted);font-size:12px;margin-top:2px;word-break:break-word}
.row .val{font-weight:700;text-align:right;white-space:nowrap}
.row .act{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;padding:4px 7px;font-size:13px}
.ib:hover{background:var(--blueSoft)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-right:4px;white-space:nowrap}
.tag.b{background:var(--blueSoft);color:var(--blue2)}
.tag.a{background:var(--amberSoft);color:var(--amberInk)}
.tag.r{background:var(--redSoft);color:var(--red)}
.tag.g{background:#eef0f4;color:var(--muted)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{background:var(--blueSoft);border-radius:10px;padding:10px 12px;font-size:13px;color:#16336b}
.note.am{background:var(--amberSoft);color:var(--amberInk)}
.hbars .it{display:grid;grid-template-columns:120px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbars .tr{height:9px;background:#edf0f6;border-radius:99px;overflow:hidden}
.hbars .tr i{display:block;height:100%;background:var(--blue)}
/* menu */
.menuWrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,33,61,.15);min-width:240px;padding:6px;z-index:40}
.menu .who{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--blueSoft)}
/* ===== tema escuro (azul-noite da marca; contraste também por claro/escuro, pensado para daltonismo) ===== */
html[data-tema="escuro"]{color-scheme:dark;
  --bg:#0B1222;--card:#141E33;--ink:#E8EEF8;--muted:#9AA7BF;--line:#26334F;
  --blue:#3B82F6;--blue2:#2563EB;--blueSoft:#18294A;
  --amber:#F59E0B;--amberInk:#FBBF4A;--amberSoft:#3A2A0C;
  --red:#F87171;--redSoft:#3B1717;--gray:#5B6785;
  --sh:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35)}
html[data-tema="escuro"] header{background:rgba(15,24,48,.96)}
html[data-tema="escuro"] .inp,html[data-tema="escuro"] .btn.sec{background:#1A2640;color:var(--ink)}
html[data-tema="escuro"] .btn.sec:hover,html[data-tema="escuro"] .menu button:hover,html[data-tema="escuro"] .bell .al:hover{background:#1F2D4D}
html[data-tema="escuro"] .brand .t1 b{color:#7FB0FF}
html[data-tema="escuro"] .tab.on{color:#7FB0FF;border-bottom-color:#7FB0FF}
html[data-tema="escuro"] .hmo{border-color:#6B4A12}
html[data-tema="escuro"] .par{border-color:#C9D3E6}
html[data-tema="escuro"] [style*="#f3f7ff"]{background:var(--card)!important;border-color:#24406E!important}
html[data-tema="escuro"] svg text[fill="#14213d"],html[data-tema="escuro"] svg text[fill="#5b6478"]{fill:#C9D3E6}
html[data-tema="escuro"] svg [stroke="#e3e7ef"]{stroke:#26334F}
html[data-tema="escuro"] .modal .lgdot,html[data-tema="escuro"] select option{background:#141E33;color:var(--ink)}
html[data-tema="escuro"]{--blue2:#7FB0FF}
html[data-tema="escuro"] .btn:hover{background:#2563EB}
html[data-tema="escuro"] .mpick,html[data-tema="escuro"] .ib,html[data-tema="escuro"] .chip,html[data-tema="escuro"] .menu,html[data-tema="escuro"] .modal,html[data-tema="escuro"] .fabMenu,html[data-tema="escuro"] .bell .hd button.chip{background:var(--card)}
html[data-tema="escuro"] .chip.on,html[data-tema="escuro"] .bell .hd button.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
html[data-tema="escuro"] .bloco{background:#111A2E}
html[data-tema="escuro"] .bar,html[data-tema="escuro"] .hbars .tr{background:#26334F}
html[data-tema="escuro"] .cal .d{background:#1A2640}
html[data-tema="escuro"] .cal .d.ok .n{color:#DBE7FF}
html[data-tema="escuro"] .tbl tr.tot td{background:#1A2640}
html[data-tema="escuro"] .tag.g{background:#26334F;color:#C9D3E6}
html[data-tema="escuro"] .note{color:#C9D8F2}
html[data-tema="escuro"] .ib:hover,html[data-tema="escuro"] .chip:hover{background:#1F2D4D}
html[data-tema="escuro"] .toast{background:#E8EEF8;color:#0B1222}
html[data-tema="escuro"] i[style*="#f6f8fb"]{background:#1A2640!important;border-color:#26334F!important}

/* celular: menus do sino e de Opções ocupam a largura da tela, logo abaixo do botão */
@media(max-width:640px){.menu{position:fixed;left:10px;right:10px;width:auto;min-width:0;max-height:calc(100vh - 140px);overflow-y:auto}.menu.bell{width:auto}}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-left:4px;vertical-align:1px}
.badge:empty{display:none}
.bell{width:min(360px,calc(100vw - 20px));max-height:72vh;overflow-y:auto;padding:10px}
.bell .hd{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.bell .it{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:13px}
.bell .it.nova{border-left:4px solid var(--blue)}
.bell .it.imp{border:2px solid var(--amber);background:var(--amberSoft)}
.bell .tagImp{display:inline-block;font-size:11px;font-weight:800;color:var(--amberInk);letter-spacing:.3px;margin-bottom:3px}
.bell .al .acts{margin-top:4px}
.bell .al.lida{opacity:.75}
.bell .it.al.crit{border:2px solid var(--red);background:var(--redSoft);color:var(--red);font-weight:600}
.bell .al .nota{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px}
.bell .it .ttl{font-weight:700}
.bell .it .meta{font-size:11px;color:var(--muted);margin:2px 0 4px}
.bell .it .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bell .it .acts button,.bell .lnk{display:inline;width:auto;border:0;background:none;color:var(--blue);padding:0;font-size:12px;font-weight:600;cursor:pointer}
.bell .al{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.bell .al:hover{background:#f7f9fc}
.bell .hd button.chip{display:inline-block;width:auto;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-weight:600}
.bell .hd button.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:17px;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.fabMenu{position:fixed;right:18px;bottom:76px;z-index:31;max-height:calc(100vh - 16px);overflow-y:auto;width:270px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,33,61,.2);padding:6px;min-width:240px}
.fabMenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600}
.fabMenu button:hover{background:var(--blueSoft)}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;border-radius:999px;padding:13px 18px;box-shadow:0 8px 22px rgba(31,111,235,.35);touch-action:none;user-select:none;-webkit-user-select:none}
.fab.drag{opacity:.9;box-shadow:0 14px 30px rgba(31,111,235,.5)}
/* cursor do mouse: mão aberta branca sobre o botão, mão fechada ao segurar e arrastar */

<script>
"use strict";
const VERSAO='V26';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>isoOf(new Date());
const mesAtual=()=>hoje().slice(0,7);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const fmtBR=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const wdOf=iso=>WD[new Date(iso+'T12:00:00').getDay()];
const mesNome=ym=>MESES[+ym.slice(5,7)-1]+'/'+ym.slice(0,4);
const mesCurto=ym=>MES3[+ym.slice(5,7)-1]+'/'+ym.slice(2,4);
const addMes=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)};
const diasNoMes=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const r2=v=>Math.round((+v||0)*100)/100;
function brl(v,semSimbolo){v=r2(v);if(Object.is(v,-0)||Math.abs(v)<0.005)v=0;const s=v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});return semSimbolo?s:'R$ '+s}
function parseBRL(s){if(s==null)return 0;s=String(s).trim().replace(/R\$\s?/,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isNaN(v)?0:r2(v)}
const minToHM=m=>{m=Math.round(+m||0);return m?Math.floor(m/60)+'h'+(m%60?' '+pad(m%60)+'m':''):'—'};
const minToInp=m=>{m=Math.round(+m||0);return m?pad(Math.floor(m/60))+':'+pad(m%60):''};
const inpToMin=s=>{if(!s)return 0;const p=String(s).split(':');return (+p[0]||0)*60+(+p[1]||0)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function logoSVG(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#1f6feb"/><path d="M22 66 A28 28 0 0 1 78 66" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M50 66 L67 45" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="66" r="7.5" fill="#f59e0b"/><path d="M22 82 H78" stroke="#bfd4ff" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/></svg>`}
function emblemaSVG(w){return `<svg width="${w}" height="${Math.round(w*1.15)}" viewBox="0 0 200 230" role="img" aria-label="Emblema Rodaliq"><path d="M100 6 L186 34 V112 C186 168 148 204 100 224 C52 204 14 168 14 112 V34 Z" fill="#14213d"/><path d="M100 18 L174 42 V112 C174 160 142 192 100 210 C58 192 26 160 26 112 V42 Z" fill="none" stroke="#1f6feb" stroke-width="4"/><g transform="translate(50 34)"><path d="M22 66 A28 28 0 0 1 78 66" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M50 66 L67 45" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="66" r="7.5" fill="#f59e0b"/><path d="M22 82 H78" stroke="#bfd4ff" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/></g><text x="100" y="148" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="30" letter-spacing="2" fill="#fff">RODALIQ</text><rect x="72" y="162" width="56" height="6" rx="3" fill="#f59e0b"/><text x="100" y="186" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="8" letter-spacing="0.6" fill="#bfd4ff">GESTÃO DO MOTORISTA</text></svg>`}
$('#logoL').innerHTML=logoSVG(40);$('#seloLogin').innerHTML=emblemaSVG(64);$('#logoH').innerHTML=logoSVG(34);


/* proteção leve (seleção e cópia continuam livres) */
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(k==='F12'||(e.ctrlKey&&k==='U')||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(k)))e.preventDefault()});

/* ---------- estado ---------- */
const TBS=['tb_corridas','tb_repasses','tb_carona','tb_custos','tb_multas','tb_carne','tb_config'];
const CFG_PADRAO={metaDiaria:150,diasMeta:[0,1,2,3,4,5,6],precoCarona:10,veiculos:[{nome:'Fastback',desc:'Fiat Fastback Impetus',desde:'',ativo:true}],veiculoPadrao:'Fastback',descontoSimplificado:true,condutores:['Diogo']};
const S={tb_corridas:[],tb_repasses:[],tb_carona:[],tb_custos:[],tb_multas:[],tb_carne:{},tb_config:JSON.parse(JSON.stringify(CFG_PADRAO))};
let DB=null,UID=null,DL=null,AUTH=null,LOGADO=null;
const UI={tab:'painel',mes:mesAtual(),veic:'Todos',sub:{corridas:'diario',custos:'Todos'},open:{},ano:new Date().getFullYear()};
const cfg=()=>S.tb_config;

function setSync(t){$('#sync').textContent=t}
const SB_URL='https://zxhgexcaswkvpotwqkqo.supabase.co',SB_KEY='sb_publishable_cHGZo50lG-YTAFx89_Lb6g_SDovxCap';
const LISTAS=['tb_corridas','tb_repasses','tb_carona','tb_custos','tb_multas'];
const SNAP={};const writing={},pend={};
function linhasDe(tb){if(LISTAS.includes(tb))return S[tb].map(r=>[String(r.id),r]);if(tb==='tb_carne')return Object.entries(S[tb]||{});return [['config',S[tb]]]}
async function selTodos(tb,cols,filtro){const out=[];for(let i=0;;i+=1000){let q=DB.from(tb).select(cols);if(filtro)q=filtro(q);const {data,error}=await q.range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function gravar(tb){
  const atual=new Map(linhasDe(tb).map(([id,v])=>[id,JSON.stringify(v)])),ant=SNAP[tb]||new Map(),agora=new Date().toISOString(),up=[],del=[];
  atual.forEach((j,id)=>{if(ant.get(id)!==j)up.push({user_id:UID,id,dados:JSON.parse(j),atualizado_em:agora})});
  ant.forEach((j,id)=>{if(!atual.has(id))del.push(id)});
  for(let i=0;i<up.length;i+=500){const {error}=await DB.from(tb).upsert(up.slice(i,i+500),{onConflict:'user_id,id'});if(error)throw error}
  for(let i=0;i<del.length;i+=200){const {error}=await DB.from(tb).delete().eq('user_id',UID).in('id',del.slice(i,i+200));if(error)throw error}
  SNAP[tb]=atual;
}
async function salvar(tb){
  if(!DB||!UID){setSync('⚠ sem banco: não salvo');return}
  pend[tb]=true;if(writing[tb])return writing[tb];
  writing[tb]=(async()=>{setSync('Salvando…');let tent=0;
    while(pend[tb]){pend[tb]=false;
      try{await gravar(tb);tent=0}
      catch(e){if(++tent<=3&&!(e&&e.code)){await new Promise(r=>setTimeout(r,800*tent));pend[tb]=true;continue}
        writing[tb]=null;setSync('⚠ erro ao salvar');toast('Não foi possível salvar ('+(e&&(e.message||e.code)||'erro')+').');return}}
    writing[tb]=null;setSync('Sincronizado ✓')})();
  return writing[tb];
}
async function carregar(){
  setSync('Carregando…');
  const t=setTimeout(()=>setSync('⚠ banco lento: dados podem estar desatualizados'),10000);
  try{
    const res=await Promise.all(TBS.map(tb=>selTodos(tb,'id,dados')));
    res.forEach((rows,i)=>{const tb=TBS[i];SNAP[tb]=new Map(rows.map(r=>[r.id,JSON.stringify(r.dados)]));
      if(LISTAS.includes(tb))S[tb]=rows.map(r=>r.dados);
      else if(tb==='tb_carne')S[tb]=Object.fromEntries(rows.map(r=>[r.id,r.dados]));
      else if(rows[0])S[tb]=rows[0].dados});
    S.tb_config=Object.assign(JSON.parse(JSON.stringify(CFG_PADRAO)),S.tb_config||{});
    const ym=mesAtual(),ya=addMes(ym,-1);
    const [cn,ev,rr]=await Promise.all([DB.from('tb_audit_counter').select('seq').maybeSingle(),
      selTodos('tb_audit_log','seq,ts,acao,area,resumo,usuario,extra',q=>q.gte('ts',new Date(+ya.slice(0,4),+ya.slice(5,7)-1,1).toISOString())),
      DB.from('tb_release_reads').select('dados').maybeSingle()]);
    AUD.seq=cn.data?+cn.data.seq||0:0;AUD.mes[ym]=[];AUD.mes[ya]=[];
    ev.forEach(e=>{const m=isoOf(new Date(e.ts)).slice(0,7);(AUD.mes[m]=AUD.mes[m]||[]).push(audRow(e))});
    NOT.reads=Object.assign({lidas:[],ocultas:[],exclEm:{}},rr.data&&rr.data.dados||{});
    await carregarNotas();
    clearTimeout(t);setSync('Sincronizado ✓');
  }catch(e){clearTimeout(t);setSync('⚠ erro ao carregar');toast('Erro ao carregar dados ('+(e&&(e.message||e.code)||'erro')+').')}
}
const audRow=e=>{const o={seq:e.seq,ts:new Date(e.ts).toISOString(),acao:e.acao,area:e.area,resumo:e.resumo||'',usuario:e.usuario||''};if(e.extra)o.extra=e.extra;return o};
async function carregarNotas(){const {data,error}=await DB.from('tb_release_notes').select('id,ts,titulo,texto,versao,importante,validade').order('ts',{ascending:false});if(error)throw error;NOT.notes=(data||[]).map(n=>Object.assign({},n,{ts:new Date(n.ts).toISOString()}))}

/* ---------- auditoria (numeração H gravada) ---------- */
const AUD={seq:0,mes:{}};let audChain=Promise.resolve();
const NOME_TB={tb_corridas:'Corridas',tb_repasses:'Repasses',tb_carona:'Carona Solidária',tb_custos:'Custos',tb_multas:'Multas',tb_carne:'Carnê-Leão',tb_config:'Configurações'};
function resumoReg(tb,r){return({tb_corridas:()=>`${r.plataforma} · ${fmtBR(r.data)} · ${brl(r.valor)}`,tb_repasses:()=>`Repasse ${r.plataforma} · ${fmtBR(r.data)} · ${brl(r.valor)}`,
  tb_carona:()=>`${r.sentido} · ${fmtBR(r.data)} · ${r.passageiros||0} pass. · ${brl(r.valor)}`,tb_custos:()=>`${r.cat} · ${r.veiculo} · ${fmtBR(r.data)} · ${brl(r.valor)}`,
  tb_multas:()=>`${r.motivo} · ${r.veiculo} · ${fmtBR(r.ocorr)}`}[tb]||(()=>''))()}
// por enquanto, só estes eventos vão para o histórico de auditoria
const AUD_ACOES=['Exclusão','Troca de senha','Exportação','Importação'],AUD_AREAS=['Veículos','Configurações'];
const audita=(acao,area)=>AUD_ACOES.includes(acao)||AUD_AREAS.includes(area);
function audit(acao,area,resumo,extra){
  if(!DB||!UID||!audita(acao,area))return Promise.resolve();
  const ts=new Date(),ym=isoOf(ts).slice(0,7);
  audChain=audChain.then(async()=>{try{
    const {data:c}=await DB.from('tb_audit_counter').select('seq').maybeSingle();
    AUD.seq=Math.max(AUD.seq,c?+c.seq||0:0)+1;
    const e={seq:AUD.seq,ts:ts.toISOString(),acao,area,resumo,usuario:LOGADO||''};if(extra)e.extra=extra;
    const r1=await DB.from('tb_audit_log').insert(Object.assign({user_id:UID},e,{extra:extra||null}));if(r1.error)throw r1.error;
    const r2=await DB.from('tb_audit_counter').upsert({user_id:UID,seq:AUD.seq},{onConflict:'user_id'});if(r2.error)throw r2.error;
    (AUD.mes[ym]=AUD.mes[ym]||[]).push(e);
  }catch(er){console.warn('auditoria',er)}});
  return audChain;
}
const dataHora=iso=>{const d=new Date(iso);return fmtBR(isoOf(d))+' - '+pad(d.getHours())+':'+pad(d.getMinutes())};
function linhaAud(e){const x=e.extra;return `<div class="row"><div class="dt">H${e.seq}<small>${dataHora(e.ts)}</small></div><div class="main"><span class="tag b">${esc(e.acao)}</span><span class="tag g">${esc(e.area)}</span><div style="margin-top:3px">${esc(e.resumo)}</div>${x&&x.antes?`<div class="small muted">Antes: ${esc(x.antes)}<br>Depois: ${esc(x.depois)}</div>`:''}</div></div>`}
async function verAuditoria(){
  const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);
  let completo=null,aberto=null;
  const ultimos=()=>Object.values(AUD.mes).flat().sort((a,b)=>b.seq-a.seq).slice(0,5);
  const draw=()=>{let corpo;
    if(!completo){const u=ultimos();corpo=(u.length?`<div class="mgroup">${u.map(linhaAud).join('')}</div>`:'<div class="empty">Nenhum evento registrado ainda.</div>')+'<button class="btn sec sm" id="aFull">Ver histórico completo</button>'}
    else{const ms=Object.keys(completo).sort().reverse();if(aberto===null)aberto=ms[0]||'';

/* ---------- IR / Carnê-Leão ---------- */
const IR={descSimpl:607.20,minDarf:10};
function irTabela(base){
  if(base<=2428.80)return 0;
  if(base<=2826.65)return base*.075-182.16;
  if(base<=3751.05)return base*.15-394.16;
  if(base<=4664.68)return base*.225-675.49;
  return base*.275-908.73;
}
function calcCarne(bruto,ano,inss){
  const trib=r2(bruto*0.6),isento=r2(bruto-trib);
  const ded=r2(cfg().descontoSimplificado?Math.max(IR.descSimpl,+inss||0):(+inss||0));
  const base=r2(Math.max(0,trib-ded));
  const irT=r2(Math.max(0,irTabela(base)));
  let red=0;
  if(ano>=2026){if(trib<=5000)red=Math.min(irT,312.89);else if(trib<=7350)red=Math.min(irT,Math.max(0,978.62-0.133145*trib))}
  red=r2(red);
  return{bruto:r2(bruto),isento,trib,ded,base,irT,red,ir:r2(Math.max(0,irT-red))};
}
function ultimoDiaUtil(ym){let d=new Date(+ym.slice(0,4),+ym.slice(5,7),0);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return isoOf(d)}
function brutoSemDarf(ano){let lo=0,hi=50000;for(let i=0;i<60;i++){const m=(lo+hi)/2;calcCarne(m,ano,0).ir<0.005?lo=m:hi=m}return Math.floor(lo*100)/100}
function linhaCarne(ym){
  const reg=S.tb_carne[ym]||{};const rp=doMes(S.tb_repasses,ym);const fonteSug=rp.length?'repasses':'diário';const sug=rp.length?sum(rp,r=>r.valor):sum(doMes(S.tb_corridas,ym).filter(fPlat),r=>r.valor);
  const temExtrato=reg.bruto!=null&&reg.bruto!=='';const apps=temExtrato?+reg.bruto:sug;
  const car=r2(sum(doMes(S.tb_carona,ym),r=>r.valor));// Carona Solidária soma no recebido do mês
  return Object.assign({ym,reg,sug,fonteSug,temExtrato,apps:r2(apps),car,venc:ultimoDiaUtil(addMes(ym,1))},calcCarne(apps+car,+ym.slice(0,4),reg.inss));
}

    else if(c.t==='time')inp=`<input class="inp num" inputmode="numeric" id="${id}" value="${esc(v)}" placeholder="hh:mm" maxlength="6">`;
    else if(c.t==='int'||c.t==='num')inp=`<input class="inp num" inputmode="decimal" id="${id}" value="${esc(v)}"${req}>`;
    else if(c.t==='check')inp=`<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" id="${id}"${v?' checked':''}> ${esc(c.txt||'')}</label>`;
    else inp=`<input class="inp" id="${id}" value="${esc(v)}"${c.list?` list="dl_${c.k}"`:''}${req}>${c.list?`<datalist id="dl_${c.k}">${c.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;

  }).join('');
  ov.innerHTML=`<form class="modal" novalidate><h2>${esc(titulo)}</h2>${sub?`<div class="small muted">${sub}</div>`:''}<div class="fgrid">${h}</div><div class="err" id="fErr"></div><div class="mfoot">${onDel?'<button type="button" class="btn warn sm" id="fDel" style="margin-right:auto">Excluir</button>':''}<button type="button" class="btn sec" id="fCan">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`;

  });

  if(onDel)ov.querySelector('#fDel').onclick=async()=>{if(await confirma('Excluir este lançamento?')){onDel();fechar()}};
  const ler=()=>{const o={};campos.forEach(c=>{const el=g(c.k);if(!el)return;
    if(c.t==='money')o[c.k]=el.value.trim()===''?null:parseBRL(el.value);
    else if(c.t==='int')o[c.k]=el.value===''?0:parseInt(el.value,10)||0;
    else if(c.t==='num')o[c.k]=el.value===''?null:parseFloat(String(el.value).replace(',','.'))||0;
    else if(c.t==='time')o[c.k]=inpToMin(el.value);
    else if(c.t==='check')o[c.k]=el.checked;
    else o[c.k]=el.value.trim()});return o};
  ov.querySelector('form').onsubmit=e=>{e.preventDefault();const o=ler();
    for(const c of campos){if(c.req&&(o[c.k]===''||o[c.k]==null)){ov.querySelector('#fErr').textContent='Preencha: '+c.l;return}
      if(c.t==='date'&&!c.allowFuture&&o[c.k]&&o[c.k]>hoje()){ov.querySelector('#fErr').textContent='Data futura não é permitida.';return}}
    const msg=onSave(o,ov);if(typeof msg==='string'){ov.querySelector('#fErr').textContent=msg;return}fechar()};
  const first=ov.querySelector('input:not([type=checkbox]),select');if(first&&window.innerWidth>700)first.focus();

// card de cobertura do combustível do mês (o tanque é um só: cada ganho mostra quanto do combustível pagaria sozinho)
function kpiComb(titulo,quem,valor,comb,partes,hl){

  const det=(partes||[]).filter(p=>p[1]).map(p=>p[0]+' '+pctTxt(p[1],comb)).join(' · ');
  return kpi(titulo,`<span class="${valor>=comb?'pos':'neg'}">${pctTxt(valor,comb)}</span>`,
    `${brl(valor)} de ${brl(comb)} de combustível · ${sobra>=0?'sobram '+brl(sobra):'faltam '+brl(-sobra)}`+(det?'<br>'+det:'')+`<br><span title="O tanque é um só (corridas, carona e uso pessoal): o % mostra quanto do combustível do mês esse ganho cobre sozinho.">ⓘ quanto ${quem} cobre sozinho</span>`,(hl||'')+' wide');
}
function bloco(t,sub,cards,acoes){return `<div class="card bloco"><div class="bh"><h2>${t}</h2><span class="small muted">${esc(sub)}</span>${acoes?`<span class="sp" style="flex:1"></span><span class="bacts">${acoes.map(([k,l])=>`<button class="btn sm" data-new="${k}">＋ ${l}</button>`).join('')}</span>`:''}</div><div class="grid cards">${cards}</div></div>`}

function relDados(){

}

  const tbl=(head,rows,al)=>`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${bd}</w:tblPr>${head?`<w:tr>${head.map((c,i)=>cel(c,{h:1,r:al&&al[i]})).join('')}</w:tr>`:''}${rows.map(r=>`<w:tr>${r.map((c,i)=>cel(c,{r:al&&al[i]})).join('')}</w:tr>`).join('')}</w:tbl>`;
  let b=par('Relatório – Rodaliq',{b:1,sz:36,cor:'14213D'})+par(M.filtroTxt,{sz:18,cor:'5B6478'})+par(geradoEm,{sz:18,cor:'5B6478'});
  M.sec.forEach((s,i)=>{b+=par('')+par((i+1)+'. '+s.t,{b:1,sz:26,cor:'1F6FEB'});
    if(s.kpis)b+=tbl(null,s.kpis.map(k=>[k[0],String(k[1]).replace(/<[^>]+>/g,'')]),[0,1]);
    if(s.cols){if(s.kpis)b+=par('');const al=s.cols.map(c=>['money','int','pct','hm'].includes(c[1]));b+=s.rows.length?tbl(s.cols.map(c=>c[0]),s.rows.map(r=>r.map((v,ci)=>fmtCell(v,s.cols[ci][1]))),al):par('Sem dados para o filtro.',{sz:18,cor:'5B6478'})}
    if(s.nota)b+=par(s.nota,{sz:16,cor:'5B6478'})});
  b+=par('')+par('© 2026 Rodaliq · Todos os direitos reservados.',{sz:16,cor:'5B6478'});
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml',doc);
  return await z.generateAsync({type:'uint8array'});
}

function formVeic(){

    <button class="btn sec sm" id="vAdd" style="margin-top:8px">＋ Adicionar veículo</button><div class="small muted" style="margin-top:6px">Renomear um veículo atualiza os lançamentos dele.</div>
    <div class="mfoot"><button class="btn sec" id="vCan">Cancelar</button><button class="btn" id="vOk">Salvar</button></div></div>`;
    ov.querySelector('#vCan').onclick=()=>ov.remove();ov.querySelector('#vAdd').onclick=()=>{ler();tmp.push({nome:'Novo',desc:'',desde:'',ativo:true});cfg().veiculos=tmp;draw()};
    ov.querySelector('#vOk').onclick=()=>{ler();const nomes=tmp.map(v=>v.nome.trim());if(nomes.some(n=>!n)||new Set(nomes).size!==nomes.length){toast('Nomes vazios ou repetidos.');return}
      orig.forEach((o,i)=>{const n=tmp[i]&&tmp[i].nome;if(n&&n!==o.nome)['tb_corridas','tb_repasses','tb_carona','tb_custos','tb_multas'].forEach(tb=>{let mud=false;S[tb].forEach(r=>{if(r.veiculo===o.nome){r.veiculo=n;mud=true}});if(mud)salvar(tb)})});
      cfg().veiculos=tmp;if(!nomes.includes(cfg().veiculoPadrao))cfg().veiculoPadrao=nomes[0];salvar('tb_config');audit('Edição','Veículos',nomes.join(', '));ov.remove();render();toast('Veículos salvos')}};
  const orig=JSON.parse(JSON.stringify(cfg().veiculos));let tmp=JSON.parse(JSON.stringify(orig));
  const ler=()=>ov.querySelectorAll('[data-vi]').forEach(el=>{const v=tmp[+el.dataset.vi];v[el.dataset.vk]=el.type==='checkbox'?el.checked:el.value});
  document.body.appendChild(ov);draw();
  ov.addEventListener('click',e=>{if(e.target.id==='vCan')cfg().veiculos=orig});
}
function formSenha(){
  openForm({titulo:'Trocar senha',campos:[{k:'a',l:'Senha atual',t:'text',full:1},{k:'n',l:'Nova senha',t:'text',full:1},{k:'n2',l:'Repita a nova senha',t:'text',full:1}],
    onSave:(o,ov)=>{(async()=>{const err=ov.querySelector('#fErr');
      if(o.n.length<6){err.textContent='A nova senha precisa de 6+ caracteres.';return}if(o.n!==o.n2){err.textContent='As senhas não conferem.';return}

      const r=await DB.auth.updateUser({password:o.n});if(r.error){err.textContent=/different/i.test(r.error.message)?'A nova senha precisa ser diferente da atual.':'Erro ao trocar a senha ('+r.error.message+').';return}
      audit('Troca de senha','Acesso','Senha alterada');ov.remove();toast('Senha alterada')})();return 'Verificando…'}});

function temaAtual(){try{return localStorage.getItem('rodaliq_tema')||'claro'}catch(e){return 'claro'}}

try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(temaAtual()==='auto')aplicaTema('auto')})}catch(e){}
function formTema(){
  const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);const at=temaAtual();
  const op=[['claro','☀ Claro','Fundo claro, como hoje.'],['escuro','🌙 Escuro','Fundo azul-noite, mais confortável à noite.'],['auto','📱 Automático','Segue o modo claro ou escuro do aparelho.']];
  ov.innerHTML=`<div class="modal" style="max-width:420px"><h2>Tema</h2><div class="small muted" style="margin-bottom:10px">Vale só para este aparelho.</div>${op.map(o=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer"><input type="radio" name="tema" value="${o[0]}"${at===o[0]?' checked':''} style="margin-top:3px"><span><b>${o[1]}</b><br><span class="small muted">${o[2]}</span></span></label>`).join('')}<div class="mfoot"><button class="btn" id="tOk">Fechar</button></div></div>`;
  ov.addEventListener('change',e=>{if(e.target.name==='tema'){try{localStorage.setItem('rodaliq_tema',e.target.value)}catch(er){}aplicaTema(e.target.value);render()}});
  ov.addEventListener('click',e=>{if(e.target.id==='tOk'||e.target===ov)ov.remove()});

function contagem(o){const c=t=>Array.isArray(o[t])?o[t].length:0;return `${c('tb_corridas')} dias, ${c('tb_repasses')} repasses, ${c('tb_carona')} caronas, ${c('tb_custos')} custos, ${c('tb_multas')} multas, ${Object.keys(o.tb_carne||{}).length} meses de carnê-leão`}
function nomeArq(){const d=new Date();return pad(d.getDate())+pad(d.getMonth()+1)+String(d.getFullYear()).slice(2)+'_'+pad(d.getHours())+pad(d.getMinutes())+'_backup_Rodaliq.json'}
async function exportar(){
  const data=JSON.stringify(Object.assign({app:'RODALIQ',versaoDados:1,versaoApp:VERSAO,exportadoEm:new Date().toISOString()},Object.fromEntries(TBS.map(t=>[t,S[t]]))),null,1);
  const fn=nomeArq();
  if(DL){try{await DL.save({filename:fn,data});audit('Exportação','Backup','Arquivo '+fn+' · '+contagem(S));toast('Backup exportado');return}catch(e){if(e&&e.code==='declined')return}}
  try{await navigator.clipboard.writeText(data);audit('Exportação','Backup','Copiado para a área de transferência · '+contagem(S));toast('Download indisponível: backup copiado para a área de transferência')}catch(e){toast('Não foi possível exportar aqui.')}
}
$('#impFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let o;try{o=JSON.parse(await f.text())}catch(er){toast('Arquivo inválido.');return}
  if(!['RODALIQ','MDD','MUDD'].includes(o.app)){toast('Este arquivo não é um backup do Rodaliq.');return}
  const cont=t=>Array.isArray(o[t])?o[t].length:0;
  if(!await confirma(`Importar <b>${esc(f.name)}</b> vai <b>substituir</b> todos os dados atuais pelos do arquivo:<br><span class="small">${cont('tb_corridas')} dias · ${cont('tb_repasses')} repasses · ${cont('tb_carona')} caronas · ${cont('tb_custos')} custos · ${cont('tb_multas')} multas · ${Object.keys(o.tb_carne||{}).length} meses de carnê-leão</span>`,'Substituir dados'))return;
  const antes=contagem(S);
  TBS.forEach(t=>{if(t==='tb_carne')S[t]=o[t]||{};else if(t==='tb_config')S[t]=Object.assign(JSON.parse(JSON.stringify(CFG_PADRAO)),o[t]||{});else S[t]=Array.isArray(o[t])?o[t]:[]});
  for(const t of TBS)await salvar(t);audit('Importação','Backup','Arquivo '+f.name+' (dados substituídos)',{antes,depois:contagem(S)});UI.open={};render();toast('Backup importado');
};

/* ---------- render e eventos ---------- */
function render(){
  const v={painel:vPainel,corridas:vCorridas,carona:vCarona,custos:vCustos,multas:vMultas,impostos:vImpostos,relatorios:vRelatorios}[UI.tab];
  $('#view').innerHTML=v();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===UI.tab));
  const vp=$('#vPick');if(vp)vp.onchange=()=>{UI.veic=vp.value.startsWith('Todos')?'Todos':vp.value;render()};
  ['simV','simD','simN'].forEach(i=>{const el=document.getElementById(i);if(el)el.oninput=simular});simular();
  atualizaSino();if(!$('#bellMenu').classList.contains('hidden'))renderSino();
}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;UI.tab=b.dataset.t;try{location.hash=UI.tab}catch(er){}render();window.scrollTo(0,0)};
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('[data-mp],[data-grp],[data-sub],[data-new],[data-ed],[data-del],[data-carne],[data-ano],[data-rel]');if(!t)return;
  if(t.dataset.rel){relAcao(t);return}
  if(t.dataset.del){const [tb,id]=t.dataset.del.split(':');const r=S[tb].find(x=>x.id===id);if(!r)return;confirma('Excluir este lançamento?<br><b>'+esc(resumoReg(tb,r))+'</b>','Excluir').then(ok=>{if(ok){remover(tb,id);toast('Lançamento excluído')}});return}
  if(t.dataset.mp){const n=addMes(UI.mes,+t.dataset.mp);if(n>mesAtual()){toast('Mês futuro');return}UI.mes=n;render()}
  else if(t.dataset.grp){const k=t.dataset.grp;UI.open[k]=UI.open[k]===t.dataset.m?null:t.dataset.m;render()}
  else if(t.dataset.sub){const [a,b]=t.dataset.sub.split(':');UI.sub[a]=b;render()}
  else if(t.dataset.new){({corrida:formCorrida,repasse:formRepasse,carona:formCarona,custo:formCusto,multa:formMulta})[t.dataset.new]()}
  else if(t.dataset.ed){const [tb,id]=t.dataset.ed.split(':');const r=S[tb].find(x=>x.id===id);if(!r)return;({tb_corridas:formCorrida,tb_repasses:formRepasse,tb_carona:formCarona,tb_custos:formCusto,tb_multas:formMulta})[tb](JSON.parse(JSON.stringify(r)))}
  else if(t.dataset.carne)formCarne(t.dataset.carne);
  else if(t.dataset.ano){const a=UI.ano+(+t.dataset.ano);if(a>new Date().getFullYear()||a<2025)return;UI.ano=a;render()}
});
let fabDrag=null,fabArrastou=false;
(()=>{const f=$('#fab');aplicaFab(fabPos());window.addEventListener('resize',()=>aplicaFab(fabPos()));
  f.addEventListener('pointerdown',e=>{fabDrag={x:e.clientX,y:e.clientY,r:f.getBoundingClientRect(),id:e.pointerId};fabArrastou=false;if(e.pointerType==='mouse')document.documentElement.classList.add('fab-segura')});
  window.addEventListener('pointermove',e=>{if(!fabDrag)return;const dx=e.clientX-fabDrag.x,dy=e.clientY-fabDrag.y;
    if(!fabArrastou){if(Math.hypot(dx,dy)<8)return;fabArrastou=true;$('#fabMenu').classList.add('hidden');f.classList.add('drag')}
    const L=Math.min(Math.max(fabDrag.r.left+dx,4),window.innerWidth-fabDrag.r.width-4),T=Math.min(Math.max(fabDrag.r.top+dy,60),window.innerHeight-fabDrag.r.height-4);
    f.style.left=L+'px';f.style.top=T+'px';f.style.right='auto';f.style.bottom='auto'});
  const solta=()=>{document.documentElement.classList.remove('fab-segura');if(!fabDrag)return;fabDrag=null;f.classList.remove('drag');if(!fabArrastou)return;const r=f.getBoundingClientRect();
    const L=fabLimites(),mx=window.innerWidth-L.w-18,my=window.innerHeight-L.h-18;
    const p={fx:+Math.max(0,Math.min(1,(r.left-18)/Math.max(1,mx-18))).toFixed(4),fy:+Math.max(0,Math.min(1,(r.top-L.minY)/Math.max(1,my-L.minY))).toFixed(4)};
    try{localStorage.setItem(FABK,JSON.stringify(p))}catch(er){}aplicaFab(p)};
  window.addEventListener('pointerup',solta);window.addEventListener('pointercancel',solta)})();
$('#fab').onclick=e=>{e.stopPropagation();if(fabArrastou){fabArrastou=false;return}fab()};
$('#fabMenu').onclick=e=>{const b=e.target.closest('[data-fab]');if(!b)return;$('#fabMenu').classList.add('hidden');if(b.dataset.fab==='tema'){formTema();return}if(b.dataset.fab==='sair'){sair();return}NOVO[b.dataset.fab]()};
document.addEventListener('click',e=>{if(!e.target.closest('#fabWrap'))$('#fabMenu').classList.add('hidden')});
$('#optBtn').onclick=e=>{e.stopPropagation();$('#bellMenu').classList.add('hidden');const m=$('#optMenu');m.classList.toggle('hidden');if(!m.classList.contains('hidden'))posMenu(m,$('#optBtn'))};
window.addEventListener('scroll',()=>{['bellMenu','optMenu'].forEach(id=>{const m=document.getElementById(id);if(m&&!m.classList.contains('hidden')&&window.innerWidth<=640)posMenu(m,document.getElementById(id==='bellMenu'?'bellBtn':'optBtn'))})},{passive:true});
document.addEventListener('click',e=>{if(!e.target.closest('#optWrap'))$('#optMenu').classList.add('hidden');if(!e.target.closest('#bellWrap'))$('#bellMenu').classList.add('hidden')});

(()=>{const h=(location.hash||'').slice(1);if(['painel','corridas','carona','custos','multas','impostos','relatorios'].includes(h))UI.tab=h})();
iniciar();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
